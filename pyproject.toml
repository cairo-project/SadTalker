[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadtalker"
version = "0.0.2"
description = "SadTalker: Learning Realistic 3D Motion Coefficients for Audio-Driven Single Image Talking Face Animation"
requires-python = ">=3.10"
dependencies = [
    "torch>=1.12",
    "torchvision",
    "torchaudio",
    "numpy",
    "face-alignment>=1.3.5",
    "imageio",
    "imageio-ffmpeg",
    "librosa",
    "opencv-python",
    "Pillow",
    "pydub",
    "scipy",
    "tqdm",
    "yacs",
    "pyyaml",
    "safetensors",
    "kornia",
    "dlib",
]

[project.scripts]
generate-sadtalker = "generate_sadtalker:main"

[tool.setuptools]
py-modules = ["generate_sadtalker", "inference"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.dat"]
