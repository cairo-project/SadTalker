[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadtalker"
version = "0.0.2"
description = "SadTalker: Learning Realistic 3D Motion Coefficients for Stylized Audio-Driven Single Image Talking Face Animation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "numpy>=1.26,<2",
    "face_alignment==1.3.5",
    "imageio>=2.27",
    "imageio-ffmpeg==0.4.7",
    "librosa==0.9.2",
    "numba",
    "resampy==0.3.1",
    "pydub==0.25.1",
    "scipy>=1.11",
    "kornia==0.6.8",
    "tqdm",
    "yacs==0.1.8",
    "pyyaml",
    "joblib==1.1.0",
    "scikit-image>=0.21",
    "basicsr @ git+https://github.com/xinntao/BasicSR.git@8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a",
    "facexlib==0.3.0",
    "gfpgan",
    "av",
    "safetensors",
]

[project.optional-dependencies]
3d = [
    "trimesh==3.9.20",
]

# uv users get the CUDA builds automatically via this index configuration
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.config" = ["*.yaml", "*.mat", "*.npy"]
